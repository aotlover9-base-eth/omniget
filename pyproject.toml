[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniget"
version = "0.1.0"
description = "Universal Social Media Post, Video, Audio, Image & Text Downloader TUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "aotlover9", email = "developer@example.com" }
]
keywords = ["media", "downloader", "youtube", "twitter", "instagram", "reddit", "facebook", "tui", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "rich>=13.0.0",
    "textual>=0.60.0",
    "yt-dlp>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
omniget = "omniget.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omniget"]

[tool.pytest.ini_options]
pythonpath = ["src"]
